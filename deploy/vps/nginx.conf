# pro-cutter — /etc/nginx/sites-available/pro-cutter (o certbot acrescenta o HTTPS).
# DOMINIOS e PORTA são trocados pelo publicar.sh.
server {
    server_name DOMINIOS;
    # XML do Promob vai no corpo da requisição
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # otimização de planos grandes pode passar de 60 s
        proxy_read_timeout 120s;
    }
    listen 80;
    listen [::]:80;
}
